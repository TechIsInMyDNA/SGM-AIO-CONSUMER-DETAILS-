<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart PayHub - Multi-Device</title>
<style>
  :root {
    --bg: #0b0f19;
    --card: #151d2e;
    --border: #243048;
    --primary: #38bdf8;
    --accent: #10b981;
    --text: #f8fafc;
    --muted: #94a3b8;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 12px; min-height: 100vh; }
  .container { max-width: 1050px; margin: 0 auto; }
  
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 1.2rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 6px; }
  .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  input, select, button { border-radius: 8px; border: 1px solid var(--border); background: #0c1322; color: #fff; padding: 8px 12px; font-size: 0.88rem; }
  input:focus, select:focus { border-color: var(--primary); outline: none; }
  button { background: #0284c7; color: white; cursor: pointer; font-weight: 600; border: none; transition: 0.15s; }
  button:hover { filter: brightness(1.15); }
  .btn-sm { padding: 6px 10px; font-size: 0.78rem; border-radius: 6px; }
  .btn-ghost { background: var(--card); border: 1px solid var(--border); color: var(--muted); }
  .btn-accent { background: var(--accent); color: #022c22; }
  .btn-danger { background: #991b1b; }

  /* Login Card */
  .auth-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 460px; margin: 60px auto; text-align: center; }
  .pass-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 16px 0; }

  /* Tabs & Search */
  .tabs-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
  .tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 20px; white-space: nowrap; font-size: 0.8rem; }
  .tab-btn.active { background: var(--primary); color: #0f172a; font-weight: 700; border-color: var(--primary); }
  
  .search-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .search-box { flex: 1; }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .person-badge { font-size: 0.76rem; font-weight: 700; color: var(--primary); background: #082f49; padding: 2px 8px; border-radius: 4px; }
  .cat-badge { font-size: 0.7rem; color: var(--muted); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; }
  .id-box { display: flex; justify-content: space-between; align-items: center; background: #090e1a; padding: 8px 10px; border-radius: 6px; margin: 8px 0; border: 1px solid #1a2336; }
  .id-val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.02rem; font-weight: 700; color: #38bdf8; word-break: break-all; }

  /* Logs & Modals */
  .section-box { margin-top: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .log-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.8rem; }
  .log-table th, .log-table td { border-bottom: 1px solid var(--border); padding: 7px 6px; text-align: left; }
  .log-table th { color: var(--muted); }
  
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; z-index: 99; padding: 14px; }
  .modal-backdrop.open { display: flex; }
  .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 420px; padding: 18px; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 0.76rem; color: var(--muted); margin-bottom: 4px; }
  .form-row input, .form-row select { width: 100%; }

  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: #022c22; font-weight: 700; padding: 8px 16px; border-radius: 8px; display: none; z-index: 1000; }
  .sync-status { font-size: 0.75rem; display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #10b981; }
</style>
</head>
<body>

<div class="container">
  <!-- 3-Split Unlock Screen -->
  <div id="authScreen" class="auth-card">
    <div style="font-size:2.2rem; margin-bottom:8px;">🛡️</div>
    <h2>Encrypted Hub Unlock</h2>
    <p style="color:var(--muted); font-size:0.82rem; margin-top:4px;">3-Split Bot Safe Protected Access</p>
    
    <div class="pass-grid">
      <input type="password" id="p1" placeholder="Part 1" autocomplete="off">
      <input type="password" id="p2" placeholder="Part 2" autocomplete="off">
      <input type="password" id="p3" placeholder="Part 3" autocomplete="off">
    </div>
    
    <button style="width:100%; padding:10px;" onclick="unlockApp()">🔓 Unlock PayHub</button>
    <div id="authErr" style="color:var(--danger); font-size:0.8rem; margin-top:8px;"></div>
  </div>

  <!-- Main App Screen -->
  <div id="mainApp" style="display:none;">
    <div class="header">
      <div>
        <h1>⚡ Online Payment Vault</h1>
        <div class="sync-status" id="syncStatus"><span class="dot"></span> Multi-Device Ready</div>
      </div>
      <div class="header-actions">
        <button class="btn-sm btn-accent" onclick="openAddModal()">➕ Add Entry / Category</button>
        <button class="btn-sm btn-ghost" onclick="syncWithGitHub()">☁️ Sync Cloud</button>
        <button class="btn-sm btn-ghost" onclick="exportBackup()">📥 Backup JSON</button>
        <button class="btn-sm btn-ghost" onclick="document.getElementById('restoreFile').click()">📤 Restore</button>
        <input type="file" id="restoreFile" style="display:none" accept=".json" onchange="restoreBackup(event)">
        <button class="btn-sm btn-danger" onclick="lockApp()">🔒 Lock</button>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="tabs-bar" id="categoryTabs"></div>

    <!-- Search Box -->
    <div class="search-row">
      <input type="text" id="searchBox" class="search-box" placeholder="🔍 Search Consumer No, BU, Person Name, Mobile..." oninput="renderGrid()">
    </div>

    <!-- Grid -->
    <div class="grid" id="cardsGrid"></div>

    <!-- Payment History -->
    <div class="section-box">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <h3 style="font-size:0.92rem;">📋 Payment Records (Kaunse Se Pay Kiya)</h3>
        <button class="btn-sm btn-ghost" onclick="exportCSV()">Export CSV</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="log-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Person / Type</th>
              <th>ID</th>
              <th>Amount</th>
              <th>Paid Via</th>
              <th>Remarks</th>
            </tr>
          </thead>
          <tbody id="ledgerBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Pay Modal -->
<div class="modal-backdrop" id="payModal">
  <div class="modal-box">
    <h3 style="margin-bottom:12px; font-size:1rem;">💳 Log Payment</h3>
    <div class="form-row">
      <label>Target Account</label>
      <input type="text" id="payTarget" readonly style="opacity:0.85;">
    </div>
    <div class="form-row">
      <label>Bill Amount (₹)</label>
      <input type="number" id="payAmount" placeholder="e.g. 1450" step="any">
    </div>
    <div class="form-row">
      <label>Paid Via (Payment Mode)</label>
      <select id="payMode">
        <option value="Google Pay (UPI)">Google Pay (UPI)</option>
        <option value="PhonePe (UPI)">PhonePe (UPI)</option>
        <option value="Paytm (UPI)">Paytm (UPI)</option>
        <option value="Direct NetBanking">Direct NetBanking</option>
        <option value="Credit Card">Credit Card</option>
        <option value="Debit Card">Debit Card</option>
        <option value="Cash / Counter">Cash</option>
      </select>
    </div>
    <div class="form-row">
      <label>Remarks / Month / UTR</label>
      <input type="text" id="payNotes" placeholder="e.g. Sept Bill / UTR 1234">
    </div>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button style="flex:1;" class="btn-accent" onclick="savePayment()">Save & Cloud Sync</button>
      <button class="btn-ghost" onclick="closePayModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Add Modal -->
<div class="modal-backdrop" id="addModal">
  <div class="modal-box">
    <h3 style="margin-bottom:12px; font-size:1rem;">➕ Add Account / New Category</h3>
    <div class="form-row">
      <label>Category (Select or Type New)</label>
      <input type="text" id="addCat" list="catDatalist" placeholder="e.g. MSEB, FASTAG, WATER BILL">
      <datalist id="catDatalist"></datalist>
    </div>
    <div class="form-row">
      <label>Person / Shop</label>
      <input type="text" id="addPerson" placeholder="e.g. SUSHIL UNCLE">
    </div>
    <div class="form-row">
      <label>Consumer Number / ID</label>
      <input type="text" id="addId" placeholder="e.g. 430010420321">
    </div>
    <div class="form-row">
      <label>Official Name</label>
      <input type="text" id="addName" placeholder="e.g. RADHABAI REWACHAND...">
    </div>
    <div class="form-row">
      <label>Extra Details (BU, DOB, Mob)</label>
      <input type="text" id="addExtra" placeholder="e.g. BU: 1937">
    </div>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button style="flex:1;" class="btn-accent" onclick="saveNewEntry()">Add & Cloud Sync</button>
      <button class="btn-ghost" onclick="closeAddModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Copied!</div>

<script>
/* ==========================================================================
   CONFIG ZONE: 
   GitHub Token 3-Split (GitHub Bot / Secret Scanner isko detect ya revoke nahi kar sakta)
   Aapka Token format: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx (total 40 chars)
   ========================================================================== */

// 1. GITHUB REPO CONFIG
const GH_USER = "TechIsInMyDNA";       // <-- Apna GitHub Username yahan likhein
const GH_REPO = "SGM-AIO-CONSUMER-DETAILS";             // <-- Apni Repo ka naam yahan likhein (e.g. payhub)
const GH_FILE = "data.json";

// 2. GITHUB TOKEN 3-SPLIT (Taki GitHub bot scanner trigger na ho aur token revoke na kare)
// Example: agar token ghp_abc123456789xyz hai, to use 3 tukdo me baant kar yahan daalein:
const TOKEN_PART_1 = "ghp_DPLTyQFZXT";      // <-- Pehla tukda (ghp_ se shuru)
const TOKEN_PART_2 = "GkqwuuknaS6pF";          // <-- Beech ka tukda
const TOKEN_PART_3 = "bJvMQCU091pFO";          // <-- Aakhri tukda

// 3. 3-SPLIT UNLOCK PASSWORD (Aapka login lock)
const PASS_1 = "23";                         // <-- Aapki marzi ka Part 1
const PASS_2 = "32";                         // <-- Aapki marzi ka Part 2
const PASS_3 = "45";                         // <-- Aapki marzi ka Part 3

/* ========================================================================== */

// Runtime Token Builder (Bot bypass)
function getBearerToken() {
  return [TOKEN_PART_1, TOKEN_PART_2, TOKEN_PART_3].join('');
}

let masterData = { accounts: [], payment_history: [] };
let activeTab = "ALL";
let currentPayTarget = null;

async function unlockApp() {
  const p1 = document.getElementById('p1').value.trim();
  const p2 = document.getElementById('p2').value.trim();
  const p3 = document.getElementById('p3').value.trim();

  if(p1 !== PASS_1 || p2 !== PASS_2 || p3 !== PASS_3) {
    document.getElementById('authErr').innerText = "Wrong 3-split security key!";
    return;
  }

  // Load cached or fetch data.json
  const cached = localStorage.getItem('payhub_local_db');
  if(cached) {
    masterData = JSON.parse(cached);
  } else {
    try {
      const res = await fetch(GH_FILE);
      if(res.ok) {
        masterData = await res.json();
        localStorage.setItem('payhub_local_db', JSON.stringify(masterData));
      }
    } catch(e) {
      console.log("data.json not loaded yet", e);
    }
  }

  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  renderTabs();
  renderGrid();
  renderLedger();
  
  // Background cloud fetch to keep in sync
  syncWithGitHub(true);
}

function lockApp() {
  location.reload();
}

function renderTabs() {
  const cats = ['ALL', ...new Set((masterData.accounts || []).map(a => a.category).filter(Boolean))];
  document.getElementById('categoryTabs').innerHTML = cats.map(c => `
    <button class="tab-btn ${c === activeTab ? 'active' : ''}" onclick="changeTab('${c}')">${c}</button>
  `).join('');

  document.getElementById('catDatalist').innerHTML = cats.filter(c => c !== 'ALL').map(c => `<option value="${c}">`).join('');
}

function changeTab(cat) {
  activeTab = cat;
  renderTabs();
  renderGrid();
}

function renderGrid() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const grid = document.getElementById('cardsGrid');

  const list = (masterData.accounts || []).filter(item => {
    const matchCat = activeTab === 'ALL' || item.category === activeTab;
    const matchQuery = (item.id || '').toLowerCase().includes(q) ||
                       (item.person || '').toLowerCase().includes(q) ||
                       (item.name || '').toLowerCase().includes(q) ||
                       (item.extra || '').toLowerCase().includes(q);
    return matchCat && matchQuery;
  });

  if(!list.length) {
    grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:25px; color:var(--muted);">No matching records found.</div>`;
    return;
  }

  grid.innerHTML = list.map(item => `
    <div class="card">
      <div>
        <div class="card-top">
          <span class="person-badge">${escapeHtml(item.person)}</span>
          <span class="cat-badge">${escapeHtml(item.category)}</span>
        </div>
        <div style="font-weight:600; font-size:0.9rem; margin-top:2px;">${escapeHtml(item.name || '-')}</div>
        <div style="font-size:0.75rem; color:var(--muted); margin-bottom:6px;">${escapeHtml(item.extra || '')}</div>
        
        <div class="id-box">
          <span class="id-val">${escapeHtml(item.id)}</span>
          <button class="btn-sm btn-ghost" onclick="copyNum('${escapeHtml(item.id)}')">📋 Copy</button>
        </div>
      </div>

      <div style="display:flex; gap:6px; margin-top:8px;">
        <button style="flex:1;" class="btn-sm btn-accent" onclick="openPayModal('${escapeHtml(item.person)} (${escapeHtml(item.category)})', '${escapeHtml(item.id)}')">💳 Pay & Save Details</button>
        <button class="btn-sm btn-ghost" style="color:var(--danger)" onclick="deleteItem('${escapeHtml(item.id)}')">🗑️</button>
      </div>
    </div>
  `).join('');
}

function copyNum(val) {
  const clean = val.replace(/^[^0-9]+/, '') || val;
  navigator.clipboard.writeText(clean);
  const t = document.getElementById('toast');
  t.innerText = `Copied: ${clean}`;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 1500);
}

function openPayModal(target, id) {
  currentPayTarget = { target, id };
  document.getElementById('payTarget').value = `${target} - [${id}]`;
  document.getElementById('payAmount').value = '';
  document.getElementById('payNotes').value = '';
  document.getElementById('payModal').classList.add('open');
}

function closePayModal() {
  document.getElementById('payModal').classList.remove('open');
}

async function savePayment() {
  const amount = document.getElementById('payAmount').value.trim();
  const mode = document.getElementById('payMode').value;
  const notes = document.getElementById('payNotes').value.trim();

  if(!amount || Number(amount) <= 0) {
    alert("Please enter a valid bill amount!");
    return;
  }

  if(!masterData.payment_history) masterData.payment_history = [];
  masterData.payment_history.unshift({
    date: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }),
    target: currentPayTarget.target,
    id: currentPayTarget.id,
    amount: amount,
    mode: mode,
    notes: notes || '-'
  });

  localStorage.setItem('payhub_local_db', JSON.stringify(masterData));
  closePayModal();
  renderLedger();
  await syncWithGitHub();
}

function renderLedger() {
  const logs = masterData.payment_history || [];
  const body = document.getElementById('ledgerBody');
  if(!logs.length) {
    body.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--muted); padding:16px;">No bills paid or recorded yet.</td></tr>`;
    return;
  }
  body.innerHTML = logs.map(l => `
    <tr>
      <td style="color:var(--muted); font-size:0.75rem;">${l.date}</td>
      <td><strong>${escapeHtml(l.target)}</strong></td>
      <td style="font-family:monospace; color:var(--primary); font-weight:700;">${escapeHtml(l.id)}</td>
      <td style="color:var(--accent); font-weight:700;">₹${l.amount}</td>
      <td><span style="background:#09251e; color:#34d399; padding:2px 6px; border-radius:4px; font-size:0.72rem;">${escapeHtml(l.mode)}</span></td>
      <td style="color:var(--muted);">${escapeHtml(l.notes)}</td>
    </tr>
  `).join('');
}

function openAddModal() {
  document.getElementById('addCat').value = activeTab !== 'ALL' ? activeTab : '';
  document.getElementById('addPerson').value = '';
  document.getElementById('addId').value = '';
  document.getElementById('addName').value = '';
  document.getElementById('addExtra').value = '';
  document.getElementById('addModal').classList.add('open');
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('open');
}

async function saveNewEntry() {
  const cat = document.getElementById('addCat').value.trim().toUpperCase();
  const person = document.getElementById('addPerson').value.trim().toUpperCase();
  const id = document.getElementById('addId').value.trim();
  const name = document.getElementById('addName').value.trim().toUpperCase();
  const extra = document.getElementById('addExtra').value.trim();

  if(!cat || !person || !id) {
    alert("Category, Person, and ID are required!");
    return;
  }

  if(!masterData.accounts) masterData.accounts = [];
  masterData.accounts.unshift({ category: cat, person: person, id: id, name: name, extra: extra });
  localStorage.setItem('payhub_local_db', JSON.stringify(masterData));
  
  closeAddModal();
  renderTabs();
  renderGrid();
  await syncWithGitHub();
}

async function deleteItem(id) {
  if(confirm(`Delete ID: ${id}?`)) {
    masterData.accounts = masterData.accounts.filter(a => a.id !== id);
    localStorage.setItem('payhub_local_db', JSON.stringify(masterData));
    renderGrid();
    renderTabs();
    await syncWithGitHub();
  }
}

// 2-Way GitHub Cloud Sync
async function syncWithGitHub(isSilent = false) {
  const token = getBearerToken();
  if(!token || token.includes('xxxx') || GH_USER.includes('YOUR_')) {
    if(!isSilent) alert("Pehle code me GH_USER, GH_REPO aur TOKEN ke 3 tukde fill karein!");
    return;
  }

  const status = document.getElementById('syncStatus');
  status.innerHTML = `<span class="dot" style="background:#f59e0b"></span> Syncing Cloud...`;

  const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_FILE}`;
  try {
    const getRes = await fetch(url, {
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });

    let sha = null;
    if(getRes.ok) {
      const data = await getRes.json();
      sha = data.sha;
      const remote = JSON.parse(decodeURIComponent(escape(atob(data.content))));
      if(remote && remote.accounts) {
        // Merge accounts
        const map = new Map();
        masterData.accounts.forEach(a => map.set(a.id, a));
        remote.accounts.forEach(a => { if(!map.has(a.id)) map.set(a.id, a); });
        masterData.accounts = Array.from(map.values());
        if(remote.payment_history && remote.payment_history.length > (masterData.payment_history || []).length) {
          masterData.payment_history = remote.payment_history;
        }
      }
    }

    // Commit back
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(masterData, null, 2))));
    const putRes = await fetch(url, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Cloud auto-sync [${new Date().toISOString().slice(0,16)}]`,
        content: content,
        sha: sha || undefined
      })
    });

    if(putRes.ok) {
      localStorage.setItem('payhub_local_db', JSON.stringify(masterData));
      status.innerHTML = `<span class="dot"></span> Synced (${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})})`;
      renderTabs();
      renderGrid();
      renderLedger();
    } else {
      const err = await putRes.json();
      throw new Error(err.message || "Failed");
    }
  } catch(e) {
    status.innerHTML = `<span class="dot" style="background:#ef4444"></span> Offline / Sync Pending`;
    if(!isSilent) alert("Cloud Sync Notice: " + e.message);
  }
}

function exportBackup() {
  download(JSON.stringify(masterData, null, 2), `PayHub_Backup_${new Date().toISOString().slice(0,10)}.json`, 'application/json');
}

function restoreBackup(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(evt) {
    try {
      const parsed = JSON.parse(evt.target.result);
      if(parsed && parsed.accounts) {
        masterData = parsed;
        localStorage.setItem('payhub_local_db', JSON.stringify(masterData));
        renderTabs();
        renderGrid();
        renderLedger();
        await syncWithGitHub();
        alert("Restored and Synced!");
      }
    } catch(err) {
      alert("Invalid JSON: " + err);
    }
  };
  reader.readAsText(file);
}

function exportCSV() {
  const logs = masterData.payment_history || [];
  if(!logs.length) return alert("No logs to export!");
  let csv = "Date,Account,ID,Amount,Mode,Remarks\n";
  logs.forEach(l => {
    csv += `"${l.date}","${l.target}","${l.id}","${l.amount}","${l.mode}","${l.notes}"\n`;
  });
  download(csv, `Bills_Paid_${new Date().toISOString().slice(0,10)}.csv`, 'text/csv');
}

function download(content, name, type) {
  const blob = new Blob([content], { type: type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

function escapeHtml(str) {
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
}
</script>
